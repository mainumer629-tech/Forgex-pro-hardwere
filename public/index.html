<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgex Hardware Control</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #0d1117; color: white; }
        button { padding: 15px 30px; font-size: 18px; border: none; cursor: pointer; border-radius: 8px; margin: 10px; font-weight: bold; }
        .on { background-color: #238636; color: white; }
        .off { background-color: #da3633; color: white; }
        #status { color: #58a6ff; font-size: 24px; }
    </style>
</head>
<body>
    <h1>🎛️ Real-Time Hardware Control Panel</h1>
    <h2 id="status">Status: OFF</h2>

    <button class="on" onclick="sendControl('ON')">Turn ON</button>
    <button class="off" onclick="sendControl('OFF')">Turn OFF</button>

    <script>
        const socket = io();

        function sendControl(state) {
            socket.emit('toggle-relay', { device: 'Relay1', status: state });
        }

        socket.on('hardware-status', (data) => {
            document.getElementById('status').innerText = `Status: ${data.status}`;
        });
    </script>
</body>
</html>
