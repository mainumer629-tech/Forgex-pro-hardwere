<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Hardware Control Panel</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 30px;
    }
    .card {
      background: #1e1e1e;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 { font-size: 24px; }
    .status {
      font-size: 22px;
      margin: 15px 0;
      color: #2196F3;
      font-weight: bold;
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      margin: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn-on { background-color: #2e7d32; color: white; }
    .btn-off { background-color: #c62828; color: white; }
    button:hover { opacity: 0.85; transform: scale(1.03); }
    
    table {
      width: 100%;
      margin-top: 25px;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #333;
    }
    th { background-color: #2d2d2d; color: #2196F3; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎛️ Real-Time Hardware Control Panel</h1>
    <div class="status">Status: <span id="device-status">OFF</span></div>

    <div>
      <button class="btn-on" onclick="sendControl('ON')">Turn ON</button>
      <button class="btn-off" onclick="sendControl('OFF')">Turn OFF</button>
    </div>

    <h3>📜 History Log (SQLite Records)</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Device</th>
          <th>Status</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody id="history-table">
        </tbody>
    </table>
  </div>

  <script>
    const socket = io();

    function fetchHistory() {
      fetch('/api/history')
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('history-table');
          tbody.innerHTML = '';
          data.forEach(row => {
            tbody.innerHTML += `
              <tr>
                <td>${row.id}</td>
                <td>${row.device}</td>
                <td style="color: ${row.status === 'ON' ? '#4CAF50' : '#F44336'}; font-weight: bold;">${row.status}</td>
                <td>${row.timestamp}</td>
              </tr>
            `;
          });
        });
    }

    function sendControl(status) {
      socket.emit('toggle-relay', { device: 'Relay1', status: status });
    }

    socket.on('hardware-status', (data) => {
      document.getElementById('device-status').innerText = data.status;
      fetchHistory();
    });

    fetchHistory();
  </script>
</body>
</html>
